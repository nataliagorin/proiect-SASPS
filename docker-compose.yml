x-bank-database: &bank-database
  image: postgres:17
  command: ["postgres", "-c", "max_prepared_transactions=100"]
  environment: &bank-database-credentials
    POSTGRES_USER: saga
    POSTGRES_PASSWORD: saga
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10
  restart: unless-stopped

services:
  alpha-bank:
    <<: *bank-database
    container_name: saga-alpha-bank
    environment:
      <<: *bank-database-credentials
      POSTGRES_DB: alpha_bank
    ports:
      - "5432:5432"
    volumes:
      - alpha_bank_data:/var/lib/postgresql/data

  beta-bank:
    <<: *bank-database
    container_name: saga-beta-bank
    environment:
      <<: *bank-database-credentials
      POSTGRES_DB: beta_bank
    ports:
      - "5433:5432"
    volumes:
      - beta_bank_data:/var/lib/postgresql/data

volumes:
  alpha_bank_data:
  beta_bank_data:
