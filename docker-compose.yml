x-bank-database: &bank-database
  image: postgres:17
  command: ["postgres", "-c", "max_prepared_transactions=100"]
  environment: &bank-database-credentials
    POSTGRES_USER: saga
    POSTGRES_PASSWORD: saga
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10
  restart: unless-stopped

services:
  bank-a:
    <<: *bank-database
    container_name: saga-bank-a
    environment:
      <<: *bank-database-credentials
      POSTGRES_DB: bank_a
    ports:
      - "5432:5432"
    volumes:
      - bank_a_data:/var/lib/postgresql/data

  bank-b:
    <<: *bank-database
    container_name: saga-bank-b
    environment:
      <<: *bank-database-credentials
      POSTGRES_DB: bank_b
    ports:
      - "5433:5432"
    volumes:
      - bank_b_data:/var/lib/postgresql/data

volumes:
  bank_a_data:
  bank_b_data:
