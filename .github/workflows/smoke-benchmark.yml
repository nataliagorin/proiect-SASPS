name: Smoke benchmark

# Manual only: the benchmark never runs on push or in the regular build.
on:
  workflow_dispatch:
    inputs:
      transfers:
        description: Measured transfers per run
        default: '500'

jobs:
  smoke-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start bank databases
        run: docker compose up -d --wait

      - name: Build
        run: ./mvnw -B -DskipTests package

      # Until BenchmarkRunner exists this only checks that the benchmark profile starts and stops.
      - name: Run benchmark profile
        run: >
          java -jar target/saga-transfer-*.jar
          --spring.profiles.active=benchmark
          --app.benchmark.transfers=${{ inputs.transfers }}
          --app.benchmark.repetitions=1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-benchmark-results
          path: results/
          if-no-files-found: ignore
