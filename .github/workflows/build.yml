name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Includes the Testcontainers tests; Docker is preinstalled on GitHub-hosted Ubuntu runners.
      - name: Build and test
        run: ./mvnw -B clean install

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # Unit tests of the benchmark charts (analysis/plot_m1.py); no database needed.
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Test analysis scripts
        run: |
          pip install -r analysis/requirements.txt
          python -m unittest discover -s analysis -v
